[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdo-autoroute-track"
version = "0.4.0"
description = "Watch the Black Desert Online auto-route marker and get alerted on arrival, a stall, or a lost route."
readme = "README.md"
license = { file = "LICENSE" }
# Capped by rapidocr-onnxruntime, which publishes no wheel for 3.13.
requires-python = ">=3.11,<3.13"
authors = [{ name = "delCatta" }]
keywords = ["black-desert-online", "bdo", "ocr", "discord", "screen-capture", "afk"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]

dependencies = [
    "opencv-python>=4.9.0",
    "mss>=9.0.1",
    "Pillow>=10.2.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
    "rapidocr-onnxruntime>=1.3.24",
    "pystray>=0.19.5",
    "pywin32>=306; sys_platform == 'win32'",
    "windows-capture>=2.0.1; sys_platform == 'win32'",
    "windows-toasts>=1.3.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
tesseract = ["pytesseract>=0.3.10"]

[project.urls]
Homepage = "https://github.com/delCatta/bdo-autoroute-track"
Issues = "https://github.com/delCatta/bdo-autoroute-track/issues"

[project.scripts]
bdo-autoroute = "bdo_autoroute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
